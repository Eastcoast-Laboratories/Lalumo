  <!-- Native App Detector - Setzt das window.isNativeApp Flag für zuverlässige App-Erkennung -->
  <script>
    // In der nativen App wird capacitorJs geladen
    // Dies ist ein zuverlässiger Indikator, dass wir in einer nativen App laufen
    window.isNativeApp = (typeof window.Capacitor !== 'undefined');
    // Use debugLog when available, fallback to console.log for early initialization
    if (window.debugLog) {
      window.debugLog('NATIVE_ENV', 'Native app environment detected:', window.isNativeApp);
    } else {
      console.log('[NATIVE_ENV] Native app environment detected:', window.isNativeApp);
    }
  </script>

  <!-- Long-press tooltip script -->
  <script>
    // Long-press tooltip functionality - inline to ensure immediate availability
    let longPressTimer = null;
    let tooltipElement = null;
    let isLongPressActive = false;
    let mouseDownStartTime = null;

    function startLongPress(event, text) {
      if (longPressTimer) {
        clearTimeout(longPressTimer);
      }
      isLongPressActive = false;
      
      // Prevent click event from firing during longpress
      event.preventDefault();
      event.stopPropagation();
      
      longPressTimer = setTimeout(() => {
        // Get tooltip text at the time of showing, not at the time of starting
        let tooltipText = text || event.target.title || event.target.getAttribute('title');
        
        // Debug: log what we're getting
        console.log('Tooltip debug:', {
          text: text,
          title: event.target.title,
          getAttribute: event.target.getAttribute('title'),
          textContent: event.target.textContent,
          innerHTML: event.target.innerHTML,
          userAgent: navigator.userAgent
        });
        
        // Fallback: use the button's text content if no title is available
        if (!tooltipText || tooltipText.trim() === '') {
          const span = event.target.querySelector('span');
          tooltipText = span ? span.textContent : event.target.textContent;
        }
        
        showTooltip(event, tooltipText);
        isLongPressActive = true;
      }, 500);
    }

    function startMouseLongPress(event, text) {
      if (longPressTimer) {
        clearTimeout(longPressTimer);
      }
      isLongPressActive = false;
      mouseDownStartTime = Date.now();
      longPressTimer = setTimeout(() => {
        // Get tooltip text at the time of showing, not at the time of starting
        let tooltipText = text || event.target.title || event.target.getAttribute('title');
        
        // Fallback: use the button's text content if no title is available
        if (!tooltipText || tooltipText.trim() === '') {
          const span = event.target.querySelector('span');
          tooltipText = span ? span.textContent : event.target.textContent;
        }
        
        showTooltip(event, tooltipText);
        isLongPressActive = true;
      }, 500);
    }

    function endLongPress(event) {
      if (longPressTimer) {
        clearTimeout(longPressTimer);
        longPressTimer = null;
      }
      hideTooltip();
      if (isLongPressActive) {
        event.preventDefault();
        event.stopPropagation();
        isLongPressActive = false;
        return false;
      }
      if (!isLongPressActive) {
        setTimeout(() => {
          event.target.click();
        }, 10);
      }
    }

    function endMouseLongPress(event) {
      if (longPressTimer) {
        clearTimeout(longPressTimer);
        longPressTimer = null;
      }
      hideTooltip();
      if (isLongPressActive) {
        event.preventDefault();
        event.stopPropagation();
        isLongPressActive = false;
        return false;
      }
      mouseDownStartTime = null;
    }

    function cancelLongPress(event) {
      if (longPressTimer) {
        clearTimeout(longPressTimer);
        longPressTimer = null;
      }
      hideTooltip();
      isLongPressActive = false;
    }

    function cancelMouseLongPress(event) {
      if (longPressTimer) {
        clearTimeout(longPressTimer);
        longPressTimer = null;
      }
      hideTooltip();
      isLongPressActive = false;
      mouseDownStartTime = null;
    }

    function showTooltip(event, text) {
      if (!text || text.trim() === '') {
        console.log('TOOLTIP_DEBUG: No text provided', { text, event });
        return;
      }
      
      console.log('TOOLTIP_DEBUG: Creating tooltip', { text, event });
      
      // Capacitor-specific: Show native alert for debugging
      if (window.Capacitor && window.Capacitor.isNativePlatform()) {
        console.log('CAPACITOR_DEBUG: Showing native alert instead of tooltip');
        if (window.Capacitor.Plugins && window.Capacitor.Plugins.Dialog) {
          window.Capacitor.Plugins.Dialog.alert({
            title: 'Longpress Tooltip',
            message: text
          });
          return;
        }
      }
      
      hideTooltip();
      
      tooltipElement = document.createElement('div');
      tooltipElement.className = 'tooltip';
      tooltipElement.textContent = text;
      document.body.appendChild(tooltipElement);
      
      let clientX = event.clientX || 100;
      let clientY = event.clientY || 100;
      
      console.log('TOOLTIP_DEBUG: Using coordinates', { clientX, clientY, hasTouch: !!event.touches });
      
      // Position in center of screen for mobile debugging
      const x = Math.max(10, Math.min(window.innerWidth - 200, clientX - 100));
      const y = Math.max(50, Math.min(window.innerHeight - 100, clientY - 50));
      
      tooltipElement.style.left = x + 'px';
      tooltipElement.style.top = y + 'px';
      
      console.log('TOOLTIP_DEBUG: Positioned tooltip', { x, y, text, windowSize: { w: window.innerWidth, h: window.innerHeight } });
      
      // Force immediate visibility
      tooltipElement.style.display = 'block';
      tooltipElement.style.visibility = 'visible';
      
      console.log('TOOLTIP_DEBUG: Tooltip should be visible now');
    }

    function hideTooltip() {
      if (tooltipElement) {
        tooltipElement.remove();
        tooltipElement = null;
      }
    }

    // Auto-initialize longpress for elements with longpress-title class
    function initializeLongpressElements() {
      const elements = document.querySelectorAll('.longpress-title');
      elements.forEach(element => {
        let longPressTimer = null;
        let isLongPressActive = false;
        
        const startLongPressHandler = (event) => {
          if (longPressTimer) clearTimeout(longPressTimer);
          isLongPressActive = false;
          
          console.log('LONGPRESS_DEBUG: Touch start detected', {
            eventType: event.type,
            hasTouch: !!event.touches,
            element: element.tagName,
            id: element.id
          });
          
          // Store the original event for tooltip positioning
          const originalEvent = {
            clientX: event.clientX || (event.touches && event.touches[0] ? event.touches[0].clientX : 100),
            clientY: event.clientY || (event.touches && event.touches[0] ? event.touches[0].clientY : 100),
            target: event.target,
            touches: event.touches
          };
          
          longPressTimer = setTimeout(() => {
            const tooltipText = element.title || element.getAttribute('title') || element.textContent;
            console.log('LONGPRESS_DEBUG: Timer fired, showing tooltip', {
              tooltipText,
              element: element.tagName,
              id: element.id,
              eventType: event.type,
              hasTouch: !!event.touches,
              coordinates: { x: originalEvent.clientX, y: originalEvent.clientY }
            });
            
            // Force show tooltip with visual indicator
            if (!tooltipText) {
              console.warn('LONGPRESS_DEBUG: No tooltip text found!');
              return;
            }
            
            showTooltip(originalEvent, tooltipText);
            isLongPressActive = true;
          }, 500);
        };
        
        const endLongPressHandler = (event) => {
          if (longPressTimer) {
            clearTimeout(longPressTimer);
            longPressTimer = null;
          }
          if (isLongPressActive) {
            hideTooltip();
            isLongPressActive = false;
            // Only prevent default if we actually showed a tooltip
            event.preventDefault();
            event.stopPropagation();
          }
        };
        
        const cancelLongPressHandler = (event) => {
          if (longPressTimer) {
            clearTimeout(longPressTimer);
            longPressTimer = null;
          }
          if (isLongPressActive) {
            hideTooltip();
            isLongPressActive = false;
          }
        };
        
        element.addEventListener('touchstart', startLongPressHandler);
        element.addEventListener('touchend', endLongPressHandler);
        element.addEventListener('touchmove', cancelLongPressHandler);
        
        // Fix for Android drag/drop error: prevent drag events on longpress elements
        element.addEventListener('dragstart', (event) => {
          event.preventDefault();
          console.log('DRAG_DEBUG: Prevented dragstart on longpress element');
        });
        
        element.addEventListener('selectstart', (event) => {
          event.preventDefault();
          console.log('DRAG_DEBUG: Prevented selectstart on longpress element');
        });
        
        // Capacitor-specific: Add click handler to show alert for debugging
        element.addEventListener('click', (event) => {
          console.log('CAPACITOR_DEBUG: Click detected on element', {
            id: element.id,
            tagName: element.tagName,
            title: element.title
          });
        });
        
        // Mouse events
        element.addEventListener('mousedown', startLongPressHandler);
        element.addEventListener('mouseup', endLongPressHandler);
        element.addEventListener('mouseleave', cancelLongPressHandler);
      });
    }
    
    // Initialize on DOM ready and when new elements are added
    document.addEventListener('DOMContentLoaded', initializeLongpressElements);
    // Re-initialize when Alpine.js updates the DOM
    document.addEventListener('alpine:init', () => {
      setTimeout(initializeLongpressElements, 100);
    });
    
    // Make functions globally available
    window.startLongPress = startLongPress;
    window.endLongPress = endLongPress;
    window.cancelLongPress = cancelLongPress;
    window.startMouseLongPress = startMouseLongPress;
    window.endMouseLongPress = endMouseLongPress;
    window.cancelMouseLongPress = cancelMouseLongPress;
    window.initializeLongpressElements = initializeLongpressElements;
  </script>

<body class="loading">
  <!-- Portrait Mode Notice -->
  <div class="portrait-notice">
    <button class="portrait-notice-close" onclick="closePortraitNotice()" ontouchstart="closePortraitNotice()" ontouchend="event.preventDefault()" aria-label="Close notice">×</button>
    <h2 data-string="portrait_notice_title">📱 Please rotate your device</h2>
    <p data-string="portrait_notice_message">Lalumo works only in portrait mode.</p>
  </div>
  
  <!-- Loading spinner overlay -->
  <div id="loading-overlay">
    <img id="loading-logo" src="./icons/icon-512.png" alt="Lalumo Logo">
    <div class="spinner"></div>
  </div>
  
  <script>
    // Set initial environment classes
    document.body.classList.add(
      window.isNativeApp ? 'native-app' : 'web-app',
      window.isAndroid ? 'android' : (window.isiOS ? 'ios' : 'desktop'),
      !window.isNativeApp && (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') ? 'dev-mode' : 'production'
    );

    // Hide loading overlay when page is fully loaded
    window.addEventListener('load', function() {
      setTimeout(function() {
        document.getElementById('loading-overlay').classList.add('hidden');
        document.body.classList.remove('loading');
      }, 50); // small delay for smoother transition
    });
    
    // Portrait mode overlay control
    function checkOrientation() {
      const portraitNotice = document.querySelector('.portrait-notice');
      const isLandscape = window.innerHeight < window.innerWidth;
      const isMobile = window.innerWidth <= 1024 || window.innerHeight <= 768;
      
      if (isLandscape && isMobile) {
        portraitNotice.style.display = 'flex';
        document.body.style.overflow = 'hidden';
      } else {
        portraitNotice.style.display = 'none';
        document.body.style.overflow = '';
      }
    }
    
    // Check orientation on load and resize
    window.addEventListener('load', checkOrientation);
    window.addEventListener('resize', checkOrientation);
    window.addEventListener('orientationchange', function() {
      setTimeout(checkOrientation, 100); // delay for orientation change
    });
    
    // Function to manually close portrait notice
    window.closePortraitNotice = function() {
      console.log('Close button clicked!');
      const portraitNotice = document.querySelector('.portrait-notice');
      if (portraitNotice) {
        portraitNotice.classList.add('hidden');
        portraitNotice.style.display = 'none';
        document.body.style.overflow = '';
        // Store preference to not show again
        localStorage.setItem('portraitNoticeDisabled', 'true');
        console.log('Portrait notice closed successfully');
      } else {
        console.error('Portrait notice element not found');
      }
    };
    
    // Check portrait notice status after Alpine is initialized
    window.checkPortraitNoticeOnInit = function() {
      setTimeout(function() {
        const isDisabled = localStorage.getItem('portraitNoticeDisabled') === 'true';
        if (isDisabled) {
          console.log('Portrait notice was previously disabled, hiding it');
          window.closePortraitNotice();
        }
      }, 100); // small delay to ensure DOM is ready
    };
    
    
  </script>

         :class="{'correct': $store.feedback.isCorrect === true, 'incorrect': $store.feedback.isCorrect === false}"
         @click="$store.feedback.showFeedback = false" title="Close">
      <button class="feedback-close-button" @click="$store.feedback.showFeedback = false" title="Close">×</button>
      <p x-text="$store.feedback.feedbackMessage"></p>
    </div>
    
    <!-- Global footer for all activities with an invers edge
    <div class="bottom_round_edge">
      <div class="footer_inner"></div>
    </div>-->

  </main>

<script>
  // Cross-platform blur helper for removing focus on touch/click events with a 1 second delay
  // This works on both web and Android platforms
  window.blurElement = function(event) {
    // Get the target element
    const target = event.currentTarget || event.target;
    window.debugLog('BLUR', 'Will blur element after 1 second delay:', target && target.tagName, target && target.className);
    
    // Let the focus stay for 1 second, then remove it
    setTimeout(() => {
      window.debugLog('BLUR', 'Now removing focus after delay, active element:', document.activeElement && document.activeElement.tagName);
      
      // Blur the element
      if (target && typeof target.blur === 'function') {
        window.debugLog('BLUR', 'Calling blur() on target');
        target.blur();
      } else {
        window.debugLog('BLUR', 'Could not call blur() on target:', target);
      }
      
      // Remove focus from active element as well
      if (document.activeElement && typeof document.activeElement.blur === 'function') {
        window.debugLog('BLUR', 'Calling blur() on document.activeElement:', document.activeElement.tagName);
        document.activeElement.blur();
      } else {
        window.debugLog('BLUR', 'Could not call blur() on document.activeElement:', document.activeElement);
      }
      
      // On Android, we need to ensure focus is removed from the element
      // This helps with removing the box shadow/focus ring that persists on touch devices
      if (target && target.classList) {
        window.debugLog('BLUR', 'Permanently removing focus styles to prevent them from reappearing');
        
        // For Android Chrome, we need to be more aggressive - reset all styles that could persist
        target.style.outline = 'none';
        target.style.boxShadow = 'none';
        target.style.webkitBoxShadow = 'none';
        target.style.webkitTapHighlightColor = 'transparent';
        
        // Special handling for play button - reset background color
        const isPlayButton = target.classList.contains('circular-play-button');
        
        // Special handling for 2_6 buttons - reset active state styles
        const is2_6Button = target.id === 'button_2_6_one' || target.id === 'button_2_6_many';
        if (is2_6Button || isPlayButton) {
          window.debugLog('BLUR', 'Resetting 2_6 button active state styles');
          // Reset background-color from :active/:hover state
          target.style.backgroundColor = 'transparent';
          target.style.transform = 'none';
          // Reset box-shadow from :active state
          target.style.boxShadow = 'none';
          // Force opacity reset
          target.style.opacity = '';
        }
        
        // Apply these styles to prevent refocus
        target.setAttribute('tabindex', '-1');
        
        // Force a repaint/reflow to ensure changes take effect
        target.offsetHeight; // Trigger reflow
        
        window.debugLog('BLUR', 'Completed blur sequence with permanent style changes');
        
        // Add an event listener to prevent refocusing
        const preventRefocus = function(e) {
          e.preventDefault();
          target.blur();
          
          // For play button, ensure background color stays reset
          if (isPlayButton) {
            target.style.backgroundColor = 'transparent';
          }
          
          window.debugLog('BLUR', 'Prevented refocus attempt');
          // Remove after handling once
          target.removeEventListener('focus', preventRefocus);
        };
        target.addEventListener('focus', preventRefocus, { once: true });
      }
    }, 1000); // 1 second delay before blurring
  };
</script>

<script>
  // Update environment classes after Alpine.js is initialized
  function updateEnvironmentClasses() {
    const body = document.body;
    
    // Remove any existing environment classes
    body.classList.remove('native-app', 'web-app', 'android', 'ios', 'desktop', 'dev', 'production');
    
    // Add current environment classes
    body.classList.add(
      window.isNativeApp ? 'native-app' : 'web-app',
      window.isAndroid ? 'android' : (window.isiOS ? 'ios' : 'desktop'),
      window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' ? 'dev' : 'production'
    );
  }
  
  // Globale Funktionen für Lazy Loading, Back-Button-Handling und Menü-Interaktion
  
  // Funktion zum automatischen Schließen des Menüs, wenn genau ein normales Menüitem verfügbar ist
  function checkAndAutoCloseMenu() {
    window.debugLog('MENU_AUTO_CLOSE', 'Checking if menu should auto-close');
    // Gib dem DOM Zeit, sich zu aktualisieren
    setTimeout(() => {
      // Kandidaten: nur sichtbare Activity-Links (<a>), keine Buttons (Buttons beinhalten u.a. die gesperrten Referral-Buttons)
      const allLinks = Array.from(document.querySelectorAll('.menu-activities a:not(.debug-element)'));
      const visibleLinks = allLinks.filter(el => {
        const style = window.getComputedStyle(el);
        const rect = el.getBoundingClientRect();
        const isVisible = style.display !== 'none' && style.visibility !== 'hidden' && rect.width > 0 && rect.height > 0;
        return isVisible && !el.hasAttribute('disabled');
      });

      // Debug-Zählwerte zusätzlich für Buttons nur zu Diagnosezwecken (nicht für Auto-Klick verwenden)
      const lockedButtons = document.querySelectorAll('.menu-activities button.locked-activity:not([disabled])');
      window.debugLog('MENU_AUTO_CLOSE', `Visible links: ${visibleLinks.length}, locked buttons: ${lockedButtons.length}`);

      // Nur wenn genau ein sichtbarer Link existiert, automatisch klicken
      if (visibleLinks.length === 1) {
        window.debugLog('MENU_AUTO_CLOSE', 'Auto-clicking the only visible activity link');
        visibleLinks[0].click();
      }
    }, 50);
  }
  
  function initLazyLoading() {
    // Initial alle Lazy-Load-Elemente laden
    loadBackgroundImages();

    // Beobachter erstellen, der neue Elemente überprüft
    const observer = new MutationObserver((mutations) => {
      mutations.forEach((mutation) => {
        if (mutation.type === 'attributes' && mutation.attributeName === 'style') {
          loadBackgroundImages();
        }
        
        if (mutation.addedNodes.length) {
          loadBackgroundImages();
        }
      });
    });

    // Beobachter auf den Container anwenden
    observer.observe(document.body, {
      childList: true,
      subtree: true,
      attributes: true,
      attributeFilter: ['style', 'x-show']
    });

    // Handler für Browser-Back-Button einrichten
    setupBackButtonHandler();
  }

  // Lädt Hintergrundbilder für sichtbare Elemente
  function loadBackgroundImages() {
    document.querySelectorAll('.lazyload-bg').forEach(element => {
      // Überprüfen, ob das Element sichtbar ist
      const rect = element.getBoundingClientRect();
      const isVisible = (
        rect.top <= (window.innerHeight || document.documentElement.clientHeight) &&
        rect.bottom >= 0 &&
        rect.left <= (window.innerWidth || document.documentElement.clientWidth) &&
        rect.right >= 0 &&
        window.getComputedStyle(element).display !== 'none'
      );

      if (isVisible && element.dataset.backgroundImage) {
        // Nur laden, wenn das Element sichtbar ist und noch kein Hintergrundbild hat
        if (!element.style.backgroundImage || element.style.backgroundImage === 'none') {
          element.style.backgroundImage = `url('${element.dataset.backgroundImage}')`;
        }
      }
    });
  }

  // Track hash navigation to avoid popstate conflicts
  let isHashNavigation = false;
  
  // Behandlung des Browser-Back-Buttons
  function setupBackButtonHandler() {
    // Erkennen der Plattform
    const isAndroid = /Android/i.test(navigator.userAgent);
        
    // Event-Listener für Store-Änderungen (wird ausgelöst, sobald Strings geladen sind)
    document.addEventListener('DOMContentLoaded', () => {
      // Initialize Alpine.js
      Alpine.start();
      
      // Load and display version number
      loadVersion();
    });

    async function loadVersion() {
      try {
        // Load package.json - angepasster Pfad für app/-Unterordner
        const response = await fetch('../package.json');
        if (!response.ok) {
          throw new Error(`Failed to fetch package.json: ${response.status}`);
        }
        const packageJson = await response.json();
        const version = packageJson.version;
        const versionCode = packageJson.versionCode;
        window.debugLog('VERSION', 'Version loaded:', version, versionCode);
        
        // Display version in credits section
        const versionElement = document.getElementById('app-version');
        if (versionElement) {
          versionElement.textContent = `Version ${version} (${versionCode})`;
        }
      } catch (error) {
        window.debugLog(['VERSION', 'ERROR'], `Error loading version: ${error.message || error}`);
      }
    }

    let currentConfirmMessage = 'Attention! Do you really want to leave this page?';
    
    // Event-Listener für Store-Änderungen (wird ausgelöst, sobald Strings geladen sind)
    document.addEventListener('alpine:initialized', function() {
      if (window.Alpine && window.Alpine.effect) {
        window.Alpine.effect(() => {
          if (Alpine.store('strings')?.back_button_confirm_exit) {
            currentConfirmMessage = Alpine.store('strings').back_button_confirm_exit;
            window.debugLog('BACK_BUTTON', 'Updated back button confirm message:', currentConfirmMessage);
          } else {
            window.debugLog(['BACK_BUTTON'], 'back button confirm message could not be set');
          }
        });
      }
    });
    
    // Listen for hash changes to mark hash navigation
    window.addEventListener('hashchange', function() {
      isHashNavigation = true;
      // Reset flag after a short delay
      setTimeout(() => {
        isHashNavigation = false;
      }, 100);
    });
    
    // Behandlung für Browser-History (web)
    window.addEventListener('popstate', function(event) {
      // Skip popstate handling if this is from hash navigation
      if (isHashNavigation) {
        window.debugLog('BACK_BUTTON', 'Skipping popstate handling for hash navigation');
        return;
      }
      
      // Testen, ob wir in einer App sind oder im Browser
      if (isAndroid) {
        // In Android: Zurück zum Menü, wenn nicht gesperrt , TODO: select by 'id="app"' instead
        const app = Alpine.getScope(document.querySelector('[x-data="app()"]'));
        if (app && !app.menuLocked) {
          // Wenn nicht im Hauptmenü, zurück zum Hauptmenü gehen
          if (app.active !== 'main') {
            app.setActive('main');
            // Verhindern des Verlassens der App
            history.pushState(null, null, window.location.pathname);
            event.preventDefault();
          }
        }
      } else {
        // Im Browser: Nachfragen, ob die Seite wirklich verlassen werden soll
        // Verwende die aktualisierte Nachrichtenvariable
        if (confirm(currentConfirmMessage)) {
          // Benutzer will die Seite verlassen -> nichts tun
        } else {
          // Benutzer will auf der Seite bleiben -> Zustand wiederherstellen
          history.pushState(null, null, window.location.pathname);
          event.preventDefault();
        }
      }
    });

    // Verhindert, dass der Benutzer die Seite verlässt, indem wir einen History-Eintrag hinzufügen
    history.pushState(null, null, window.location.pathname);
  }
</script>
