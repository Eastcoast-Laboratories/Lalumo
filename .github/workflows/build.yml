name: Build Mobile App

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      
    - name: Install npm dependencies
      run: npm ci
      
    - name: Build web app and sync with Capacitor
      run: bash mobile-build.sh android
      
    - name: Make gradlew executable
      run: chmod +x android/gradlew
      
    - name: Accept Android SDK licenses
      run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
      
    - name: Build Android APK (with retries)
      working-directory: android
      run: |
        # Try normal build first
        if ./gradlew assembleDebug; then
          echo "Build successful on first attempt"
        else
          echo "First build failed, trying with --no-daemon"
          if ./gradlew assembleDebug --no-daemon; then
            echo "Build successful with --no-daemon"
          else
            echo "Build failed. Attempting to pre-download dependencies..."
            ./gradlew dependencies --no-daemon || true
            echo "Retrying build..."
            ./gradlew assembleDebug --no-daemon
          fi
        fi
      
    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: android-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30
        
    - name: Upload build logs on failure
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: build-logs
        path: |
          android/build/
          android/app/build/
        retention-days: 7