WebSite: https://lalumo.eu
SourceCode: https://github.com/Eastcoast-Laboratories/Lalumo
IssueTracker: https://github.com/Eastcoast-Laboratories/Lalumo/issues
Changelog: https://github.com/Eastcoast-Laboratories/Lalumo/releases

AutoName: Lalumo

RepoType: git
Repo: https://github.com/Eastcoast-Laboratories/Lalumo

Builds:
  - versionName: '5.3'
    versionCode: 34
    commit: 5686590178abe7a61e79a83be85fe110242f5575
    subdir: android
    sudo:
      - apt-get update
      - apt-get install -y openjdk-17-jdk-headless
      - apt-get install -y npm
      - update-alternatives --set java /usr/lib/jvm/java-17-openjdk-amd64/bin/java
    gradle:
      - yes
    prebuild:
      - cd ..
      - npm install --build-from-source
      - mkdir -p app/images/backgrounds
      - cp -r public/images/backgrounds/* app/images/backgrounds/
      - mkdir -p android/capacitor-cordova-android-plugins
      - echo "// Empty cordova variables" > android/capacitor-cordova-android-plugins/cordova.variables.gradle
      - bash mobile-build.sh
      - cd android/app
      - rm -f fdroid-release.keystore
      - keytool -genkey -v -keystore fdroid-release.keystore -storepass fdroidpass
        -alias fdroidkey -keypass fdroidpass -keyalg RSA -keysize 2048 -validity 10000
        -dname "CN=F-Droid Release,O=Lalumo,C=US"
    scanignore:
      - node_modules/@capacitor/cli/assets/capacitor-cordova-android-plugins.tar.gz
    scandelete:
      - node_modules
    build:
      - mkdir -p build/outputs/apk
      - find app/build/outputs/apk -name "*.apk" -exec cp {} build/outputs/apk/ \;
    gradleprops:
      - fdroid

AutoUpdateMode: Version
UpdateCheckMode: Tags
CurrentVersion: '5.3'
CurrentVersionCode: 34
