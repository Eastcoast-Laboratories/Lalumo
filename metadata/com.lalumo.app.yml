IssueTracker: https://github.com/Eastcoast-Laboratories/Lalumo/issues
Changelog: https://github.com/Eastcoast-Laboratories/Lalumo/releases

AutoName: Lalumo

RepoType: git
Repo: https://github.com/Eastcoast-Laboratories/Lalumo

Builds:
  - versionName: '5.4'
    versionCode: 35
    commit: eea74a60c01d34827daa724031c2bc6aec60781e
    subdir: android/app
    sudo:
      - apt-get update
      - apt-get install -y npm
    gradle:
      - yes
    prebuild:
      - pushd ../..
      - npm install --build-from-source
      - mkdir -p app/images/backgrounds
      - cp -r public/images/backgrounds/* app/images/backgrounds/
      - mkdir -p android/capacitor-cordova-android-plugins
      - echo "// Empty cordova variables" > android/capacitor-cordova-android-plugins/cordova.variables.gradle
      - echo "ext.cdvPluginPostBuildExtras = []" >> android/capacitor-cordova-android-plugins/cordova.variables.gradle
      - echo "apply plugin: 'com.android.library'" > android/capacitor-cordova-android-plugins/build.gradle
      - echo "android { compileSdkVersion rootProject.ext.compileSdkVersion }" >> android/capacitor-cordova-android-plugins/build.gradle
      - echo "for (def func : cdvPluginPostBuildExtras) { func() }" >> android/capacitor-cordova-android-plugins/build.gradle
      - bash mobile-build.sh
      - popd
    scanignore:
      - node_modules/@capacitor/cli/assets/capacitor-cordova-android-plugins.tar.gz
    scandelete:
      - node_modules
    gradleprops:
      - fdroid

AutoUpdateMode: Version
UpdateCheckMode: Tags
CurrentVersion: '5.4'
CurrentVersionCode: 35
